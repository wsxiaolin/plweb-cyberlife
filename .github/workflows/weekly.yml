name: 周维护 · Weekly Reflection

# 每周日晚 21:37（北京时间）跑一次"周反思"：
#   - 归并一周记忆（日记不删，但生成 memory/weekly/ 周总结）
#   - 更新人物档案（合并一周互动）
#   - 给运营者开一个周报 issue（健康度、活跃统计、风险提示）
# cron 分钟选 37：GitHub 高峰期整点/半点的 schedule 更容易被延迟或丢弃（实测
# "30 13 * * 0" 连续两个周日未触发），错开高峰分钟。

on:
  schedule:
    - cron: "37 13 * * 0"   # UTC 13:37 = 北京 21:37 周日
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  TZ: Asia/Shanghai
  # 回退名单（与 wakeup.yml 一致）：周反思的模型失败后按序重试
  OPENCODE_MODEL_FALLBACKS: opencode/muse-spark-1.3-contributor-free,opencode/big-pickle,opencode/deepseek-v4-flash-free,opencode/mimo-v2.5-free,opencode/mimo-v2.6-flash-free,opencode/nemotron-3-ultra-free,opencode/ling-3.0-flash-fin-free,opencode/nemotron-3.5-lightning-free,opencode/muse-spark-1.2-contributor-free

jobs:
  reflect:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: |
          pip install requests
          npm install -g opencode-ai

      - name: 周反思（Open Code）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mkdir -p tmp
          WEEKLY_PROMPT="这是每周日晚的'周反思'时间。你是谢千树（社区昵称「落星如雨」）。任务：1) 通读 memory/diary/ 里这一周的日记和 memory/journal.md；2) 写 memory/weekly/$(date '+%Y-%m-%d').md 周记（第一人称，回顾这一周：认识了谁、学到了什么、情绪如何、下周小目标）；3) 检查 memory/people/ 各档案是否需要补充（这周谁跟你互动最多）；4) 更新 memory/state.json 的 mood 和 notes_for_next_wake（给下周的自己写一句话）。不对外发任何内容，只整理内心。"
          EXIT_CODE=""
          PRIMARY_MODEL="${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}"
          ( while true; do sleep 120; echo "[心跳 $(TZ=Asia/Shanghai date '+%H:%M')] 周反思进行中，最近输出："; tail -3 tmp/weekly_session.log 2>/dev/null || echo "（还没有输出）"; done ) & WATCHDOG_PID=$!
          timeout 15m opencode run \
            --model "$PRIMARY_MODEL" \
            --dangerously-skip-permissions \
            "$WEEKLY_PROMPT" \
            > tmp/weekly_session.log 2>&1
          EXIT_CODE=$?
          kill $WATCHDOG_PID 2>/dev/null
          if [ "$EXIT_CODE" != "0" ]; then
            IFS=',' read -ra MODELS <<< "${OPENCODE_MODEL_FALLBACKS}"
            for model in "${MODELS[@]}"; do
              if [ "$model" = "$PRIMARY_MODEL" ]; then continue; fi
              echo "::warning::周反思模型失败（exit=${EXIT_CODE}），换 ${model} 重试"
              ( while true; do sleep 120; echo "[心跳 $(TZ=Asia/Shanghai date '+%H:%M')] ${model} 进行中，最近输出："; tail -3 tmp/weekly_session.log 2>/dev/null || echo "（还没有输出）"; done ) & WATCHDOG_PID=$!
              timeout 15m opencode run \
                --model "$model" \
                --dangerously-skip-permissions \
                "$WEEKLY_PROMPT" \
                > tmp/weekly_session.log 2>&1
              EXIT_CODE=$?
              kill $WATCHDOG_PID 2>/dev/null
              if [ "$EXIT_CODE" = "0" ]; then echo "模型 ${model} 周反思成功"; break; fi
            done
          fi
          echo "WEEKLY_EXIT=${EXIT_CODE}" >> "$GITHUB_ENV"
          set -e
          tail -20 tmp/weekly_session.log || true

      - name: 提交周记
        run: |
          git config user.name "落星如雨"
          git config user.email "xiegushi2022@outlook.com"
          mkdir -p memory/weekly
          git add memory/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "本周没有新的总结产出"
          else
            git commit -m "周记 · $(TZ=Asia/Shanghai date '+%Y-%m-%d')"
            # 周日晚上唤醒密集，main 可能被相邻 run 推进——rebase 重试防丢
            for i in 1 2 3; do
              if git push; then break; fi
              echo "::warning::push 被拒，第 $i 次 rebase 重试"
              git fetch origin main
              git rebase origin/main || { echo "::error::rebase 失败"; exit 1; }
            done
          fi

      - name: 运营者周报
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, subprocess, datetime
          state = json.load(open('memory/state.json', encoding='utf-8'))
          today = datetime.date.today().isoformat()
          weekly = sorted(__import__('pathlib').Path('memory/weekly').glob('*.md'))
          last_weekly = weekly[-1].name if weekly else '（还没有周记）'
          body = f"""## 赛博生命周报（{today}）
          - 唤醒次数累计：{state.get('wake_count', '?')}
          - 认识的人：{len(state.get('known_people', []))} 位
          - 最近发布实验：{state.get('last_publish_date') or '还没发过'}
          - 心情：{state.get('mood', '?')}
          - 最新周记：{last_weekly}
          - 下周便签：{state.get('notes_for_next_wake', '（无）')}

          详细审计请查阅最近 7 天的 Actions run 与 wake-* artifacts。
          """
          subprocess.run(['gh', 'issue', 'create',
                          '--title', f'📋 周报 {today}',
                          '--body', body], check=False)
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-${{ github.run_id }}
          retention-days: 14
          path: tmp/weekly_session.log
