name: 唤醒 · Wake

# 赛博生命的"生物钟"。时间均为北京时间（cron 用 UTC，北京=UTC+8）。
# 全部槽位每天都会触发，由"作息门卫"（tools/schedule_gate.py）判定今天该开哪组：
#   上学日（周一~周五，且非法定节假日/寒暑假）：
#     06:55 早自习前        -> 55 22 * * * (UTC 前一天)
#     12:40 午休            -> 40 4  * * *
#     22:05 晚自习回家后    -> 5  14 * * *
#   自由日（周末 / 法定节假日 / 寒暑假）8 醒，08:30~22:30 每 2 小时一槽：
#     08:30 / 10:30 / 12:30 / 14:30 / 16:30 / 18:30 / 20:30 / 22:30
#                           -> 30 0 / 30 2 / 30 4 / 30 6 / 30 8 / 30 10 / 30 12 / 30 14 * * *
#   调休补班的周末会被 API 识别为上学日；手动唤醒（workflow_dispatch）不受门卫限制。
# GitHub cron 本身有几分钟到几十分钟的随机延迟，天然形成"人味抖动"；门卫容差 ±100 分钟。
# 改作息：config/life.json 的 wake_slots 与这里的 cron 要同步改。

on:
  schedule:
    - cron: "55 22 * * *"
    - cron: "40 4 * * *"
    - cron: "5 14 * * *"
    - cron: "30 0 * * *"
    - cron: "30 2 * * *"
    - cron: "30 4 * * *"
    - cron: "30 6 * * *"
    - cron: "30 8 * * *"
    - cron: "30 10 * * *"
    - cron: "30 12 * * *"
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      trigger_note:
        description: "手动唤醒原因（会写进提示词，如 '运营者手动唤醒'）"
        default: "运营者手动唤醒"
      model_override:
        description: "覆盖本次模型（如 opencode/big-pickle），留空用默认"
        default: ""

concurrency:
  group: wakeup
  cancel-in-progress: false   # 排队不取消：一次只醒一个

permissions:
  contents: write   # 提交记忆回仓库
  issues: write     # 唤醒异常时自动开 issue 告警
  actions: write    # 作息门卫可取消"不该醒"的运行

env:
  TZ: Asia/Shanghai
  # 模型可被 repo variable OPENCODE_MODEL / 手动输入覆盖；默认免费模型（plweb2 同款）
  OPENCODE_MODEL_DEFAULT: opencode/deepseek-v4-flash-free
  # 回退名单：主模型失败后按此顺序逐个换模型（同样的完整人生，任务不简化），
  # 逗号分隔；名单与主模型重复的项会自动跳过
  OPENCODE_MODEL_FALLBACKS: opencode/muse-spark-1.3-contributor-free,opencode/big-pickle,opencode/deepseek-v4-flash-free,opencode/mimo-v2.5-free,opencode/mimo-v2.6-flash-free,opencode/nemotron-3-ultra-free,opencode/ling-3.0-flash-fin-free,opencode/nemotron-3.5-lightning-free,opencode/muse-spark-1.2-contributor-free

jobs:
  wake:
    runs-on: ubuntu-latest
    # 最坏预算：主模型 40m + 回退名单 8 级 × 25m = 240m，再留出 checkout/prepare/finalize/提交
    timeout-minutes: 300
    steps:
      - name: 检出仓库（含全部记忆）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 作息门卫（现在该醒吗？）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          GATE="$(python3 tools/schedule_gate.py --event "${{ github.event_name }}")"
          GATE_RC=$?
          echo "$GATE"
          if [ "$GATE_RC" != "0" ]; then
            echo "::warning::作息门卫脚本异常（rc=$GATE_RC），按原逻辑放行唤醒"
            exit 0
          fi
          OPEN="$(printf '%s' "$GATE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("open"))' 2>/dev/null)"
          if [ "$OPEN" = "False" ]; then
            echo "::notice::作息门卫：现在不该醒（详见上方 JSON），本次运行取消，不算失败"
            if ! gh run cancel "${{ github.run_id }}"; then
              echo "::error::作息门卫判定不该醒，但取消运行失败——直接终止本次唤醒"
              exit 1
            fi
            sleep 30
          fi

      - name: 安装 Python 3.14 与依赖
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r tools/requirements.txt

      - name: 安装 Open Code CLI
        run: npm install -g opencode-ai

      - name: 睁眼 · 拉取社区动态（prepare）
        env:
          PLWEB_EMAIL: ${{ secrets.PLWEB_EMAIL }}
          PLWEB_PASSWORD: ${{ secrets.PLWEB_PASSWORD }}
        run: |
          set +e
          python tools/prepare.py --browse-pages 2
          echo "PREPARE_EXIT=$?" >> "$GITHUB_ENV"
          set -e
          # 登录失败(2)：跳过 Agent，直接走 finalize 写"断网日"日记（回退策略 L1）
          if [ "${PREPARE_EXIT}" = "2" ]; then
            echo "::warning::社区登录失败，本次唤醒降级为离线日记模式"
          fi

      - name: 模型选择
        run: |
          if [ -n "${{ github.event.inputs.model_override }}" ]; then
            echo "MODEL=${{ github.event.inputs.model_override }}" >> "$GITHUB_ENV"
          elif [ -n "${{ vars.OPENCODE_MODEL }}" ]; then
            echo "MODEL=${{ vars.OPENCODE_MODEL }}" >> "$GITHUB_ENV"
          else
            echo "MODEL=${OPENCODE_MODEL_DEFAULT}" >> "$GITHUB_ENV"
          fi

      - name: 生活 · Open Code 主模型唤醒
        if: env.PREPARE_EXIT == '0'
        env:
          # 运营者若有自有模型密钥，填入 repo secrets 即可透传给 opencode
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          TRIGGER="${{ github.event_name }}"
          [ "$TRIGGER" = "workflow_dispatch" ] && TRIGGER="手动唤醒（${{ github.event.inputs.trigger_note }}）"
          python3 - "$TRIGGER" <<'PY' > tmp/wake_prompt.txt
          import sys, datetime
          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8)))
          tpl = open("prompts/wakeup.md", encoding="utf-8").read()
          tpl = tpl.replace("{DATE}", now.strftime("%Y-%m-%d"))
          tpl = tpl.replace("{TIME}", now.strftime("%H:%M"))
          tpl = tpl.replace("{TRIGGER}", sys.argv[1])
          sys.stdout.write(tpl)
          PY
          # 心跳看护：agent 输出全部重定向到文件，CI 页面会长时间无输出像卡死；
          # 每 2 分钟把日志尾部打进 CI 日志证明"还活着"
          ( while true; do sleep 120; echo "[心跳 $(TZ=Asia/Shanghai date '+%H:%M')] 主模型进行中，最近输出："; tail -3 tmp/agent_session.log 2>/dev/null || echo "（还没有输出）"; done ) & WATCHDOG_PID=$!
          timeout 40m opencode run \
            --model "${{ env.MODEL }}" \
            --dangerously-skip-permissions \
            "$(cat tmp/wake_prompt.txt)" \
            > tmp/agent_session.log 2>&1
          echo "AGENT_EXIT=$?" >> "$GITHUB_ENV"
          kill $WATCHDOG_PID 2>/dev/null
          set -e
          echo "主模型退出码：${AGENT_EXIT}"
          tail -30 tmp/agent_session.log || true

      - name: 生活 · 自动回退（按名单换模型，同样的完整人生）
        if: env.PREPARE_EXIT == '0' && env.AGENT_EXIT != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          EXIT_CODE="${AGENT_EXIT}"
          IFS=',' read -ra MODELS <<< "${OPENCODE_MODEL_FALLBACKS}"
          for model in "${MODELS[@]}"; do
            if [ "$model" = "${{ env.MODEL }}" ]; then
              echo "跳过 ${model}（主模型刚失败过）"
              continue
            fi
            echo "::warning::主模型失败（exit=${EXIT_CODE}），换名单模型 ${model} 继续同一段人生（任务不简化）"
            ( while true; do sleep 120; echo "[心跳 $(TZ=Asia/Shanghai date '+%H:%M')] ${model} 进行中，最近输出："; tail -3 tmp/agent_fallback.log 2>/dev/null || echo "（还没有输出）"; done ) & WATCHDOG_PID=$!
            timeout 25m opencode run \
              --model "$model" \
              --dangerously-skip-permissions \
              "$(cat tmp/wake_prompt.txt)" \
              > tmp/agent_fallback.log 2>&1
            EXIT_CODE=$?
            echo "AGENT_EXIT=${EXIT_CODE}" >> "$GITHUB_ENV"
            kill $WATCHDOG_PID 2>/dev/null
            tail -20 tmp/agent_fallback.log || true
            if [ "$EXIT_CODE" = "0" ]; then
              echo "模型 ${model} 唤醒成功，停止回退"
              break
            fi
            echo "::warning::模型 ${model} 失败（exit=${EXIT_CODE}），试名单下一个"
          done
          set -e
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::回退名单全部失败（exit=${EXIT_CODE}），交由 finalize 按失败处理"
          fi

      - name: 收尾 · 校验与自动修复（finalize）
        run: |
          set +e
          python tools/finalize.py --agent-exit "${AGENT_EXIT:-2}"
          echo "FINALIZE_EXIT=$?" >> "$GITHUB_ENV"
          set -e
          cat tmp/wake_report.json || true

      - name: 提交记忆回仓库
        run: |
          git config user.name "落星如雨"
          git config user.email "xiegushi2022@outlook.com"
          git add memory/ persona/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "本次唤醒没有记忆变化（沉默的一天也是一天）"
          else
            git commit -m "记忆 · $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') 醒过一次"
            git push
          fi

      - name: 异常告警（连续失败开 issue）
        if: env.FINALIZE_EXIT == '3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "🤒 唤醒异常 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" \
            --body "finalize 判定为严重失败（fatal）。查看 run 日志与 wake_report.json。若连续多次失败，请检查：1) 社区账号凭据 2) 模型可用性 3) prepare 的 errors 字段。" \
            --label "wake-failure" || echo "issue 创建失败（可能 label 不存在，忽略）"

      - name: 归档审计材料
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wake-${{ github.run_id }}
          retention-days: 7
          path: |
            tmp/inbox.json
            tmp/actions.log
            tmp/wake_report.json
            tmp/agent_session.log
            tmp/agent_fallback.log
